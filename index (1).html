<style>

:root[data-theme="dark"]{--bg:#150d12;--card:rgba(48,28,38,.72);--ink:#fbe9ee;--mute:#c29aa7;--acc:#ff7fa3;--gold:#e6c28a;--line:rgba(255,127,163,.18);--soft:#3b2431;--g1:#4a1f33;--g2:#2c1a1f;color-scheme:dark}

h1{margin:0;font-size:2.3rem;letter-spacing:.5px}

h2{margin:18px 0 10px;font-size:1.4rem}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 6px 24px rgba(194,69,107,.08)}

.btn2{background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer}

.item{display:flex;gap:11px;align-items:flex-start;margin-top:10px;animation:pop .35s}

.obs,.meta{color:var(--mute);font-size:.82rem;margin-top:3px}.who{background:var(--soft);border-radius:10px;padding:1px 8px;margin-right:6px}
.ab button{display:block;border:0;background:none;cursor:pointer;font-size:1.2rem;padding:3px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ph{padding:0;overflow:hidden;position:relative}.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ph .cap{padding:8px 10px;font-size:.85rem}.ph .x{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:50%;width:28px;height:28px;cursor:pointer}
.bar{height:9px;background:var(--soft);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .4s}
.cnt{font-family:"Playfair Display",Georgia,serif;font-size:1.5rem;color:var(--gold);text-align:center;min-width:64px;line-height:1}.cnt small{display:block;font:.7rem Inter,sans-serif;color:var(--mute)}
.big{font-family:"Playfair Display",Georgia,serif;font-size:1.35rem;text-align:center;padding:26px 8px;min-height:110px;display:grid;place-items:center}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;gap:2px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:5px;max-width:100%}
nav button{border:0;background:none;color:var(--mute);cursor:pointer;padding:8px 12px;border-radius:20px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:1.25rem;font-weight:400}nav .on{background:var(--acc);color:#fff}
.vazio,#msg{color:var(--mute);text-align:center;padding:28px 10px}
#login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:var(--bg)}#login form{max-width:360px;width:100%;text-align:center}#login input{flex:1 1 100%}</style>
</head>

function nextOcc(iso,yearly){var d=days(iso);if(!yearly||d>=0)return d;var p=iso.split('-'),y=new Date().getFullYear();var n=days(y+'-'+p[1]+'-'+p[2]);return n>=0?n:days((y+1)+'-'+p[1]+'-'+p[2]);}

 var l=list('lista').filter(function(d){return fil=='todos'||(fil=='meus'&&d.owner===me)||(fil=='outros'&&d.owner!==me)||(fil=='feitos'&&d.done)});
 l.sort(function(a,b){return (a.done?1:0)-(b.done?1:0)||(b.prio||1)-(a.prio||1)||(b.criado||0)-(a.criado||0)});
 return '<h2>Lista de desejos</h2><form class="glass" data-f="lista"><input name="nome" placeholder="O que você quer? (colar, anel, viagem…)" required maxlength="80"><select name="emoji">'+['🎁','💍','📿','👗','👟','🌹','🍫','🧸','✈️','🍽️'].map(function(e){return '<option>'+e+'</option>'}).join('')+'</select><select name="prio"><option value="1">💗 Quero</option><option value="2">💗💗 Muito</option><option value="3">💗💗💗 Sonho</option></select><input name="obs" placeholder="Observação ou link" maxlength="200"><button class="btn">Adicionar</button></form><div class="filt">'+[['todos','Todos'],['meus','Meus'],['outros','Do outro'],['feitos','Realizados']].map(function(f){return '<button data-fl="'+f[0]+'" class="'+(f[0]==fil?'on':'')+'">'+f[1]+'</button>'}).join('')+'</div>'+
 (l.length?l.map(function(d){var ob=d.obs||'',lk=/^https?:\/\//i.test(ob);return '<div class="glass item'+(d.done?' done':'')+'"><div class="ic">'+esc(d.emoji)+'</div><div class="tx"><div class="nm">'+esc(d.nome)+'</div>'+(ob?'<div class="obs">'+(lk?'<a href="'+esc(ob)+'" target="_blank" rel="noopener" style="color:var(--acc)">ver link</a>':esc(ob))+'</div>':'')+'<div class="meta"><span class="who">'+esc(nome(d.owner,d.ownerNome))+'</span>'+'💗'.repeat(d.prio||1)+'</div></div><div class="ab"><button data-a="done" data-k="lista" data-id="'+d.id+'">'+(d.done?'↩️':'✅')+'</button>'+(d.owner===me?'<button data-a="del" data-k="lista" data-id="'+d.id+'">🗑️</button>':'')+'</div></div>'}).join(''):'<div class="vazio">Nada por aqui ainda 🌷</div>');},
mem:function(){
 var l=list('mem').sort(function(a,b){return (b.criado||0)-(a.criado||0)});
 return '<h2>Nossas memórias</h2>'+(assets?'<form class="glass" data-f="mem"><input name="legenda" placeholder="Legenda (ex.: nosso primeiro passeio)" maxlength="100"><input type="file" name="foto" accept="image/*" required><button class="btn">Guardar memória 📸</button></form>':'<div class="glass vazio">Para enviar fotos, o dono da página precisa liberar seu acesso.</div>')+
 (l.length?'<div class="grid">'+l.map(function(d){return '<div class="glass ph"><img src="'+esc(d.url)+'" alt="" loading="lazy"><div class="cap">'+esc(d.legenda||'')+'<div class="meta">'+esc(nome(d.owner,d.ownerNome))+' · '+new Date(d.criado).toLocaleDateString('pt-BR')+'</div></div>'+(d.owner===me?'<button class="x" data-a="del" data-k="mem" data-id="'+d.id+'">✕</button>':'')+'</div>'}).join('')+'</div>':'<div class="vazio">Ainda sem fotos. Guardem o primeiro momento 💞</div>');},
datas:function(){
 var l=list('datas').map(function(d){d.n=nextOcc(d.data,d.anual);return d});
 if(cfg.inicio){var p=cfg.inicio.split('-'),t=new Date(),m=new Date(t.getFullYear(),t.getMonth(),+p[2]);if(m<new Date(t.getFullYear(),t.getMonth(),t.getDate()))m=new Date(t.getFullYear(),t.getMonth()+1,+p[2]);var iso=m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-'+String(m.getDate()).padStart(2,'0');l.push({id:'auto',titulo:'Mêsversário',emoji:'💞',data:iso,n:days(iso),auto:1});}
 l.sort(function(a,b){return a.n-b.n});
 return '<h2>Datas especiais</h2><form class="glass" data-f="datas"><input name="nome" placeholder="Título (aniversário, viagem…)" required maxlength="60"><input type="date" name="data" required><select name="anual"><option value="">Uma vez</option><option value="1">Todo ano</option></select><button class="btn">Adicionar data</button></form>'+
 (l.length?l.map(function(d){return '<div class="glass item"><div class="cnt">'+(d.n<0?'—':d.n)+'<small>'+(d.n===0?'é hoje!':d.n<0?'passou':'dias')+'</small></div><div class="tx"><div class="nm">'+esc(d.emoji||'📅')+' '+esc(d.titulo||d.nome)+'</div><div class="meta">'+d.data.split('-').reverse().join('/')+(d.anual?' · todo ano':'')+'</div></div>'+(!d.auto&&d.owner===me?'<div class="ab"><button data-a="del" data-k="datas" data-id="'+d.id+'">🗑️</button></div>':'')+'</div>'}).join(''):'<div class="vazio">Nenhuma data ainda.</div>');},

 return '<h2>Metas a dois</h2><form class="glass" data-f="metas"><input name="nome" placeholder="Meta (ex.: juntar para a viagem)" required maxlength="80"><input type="number" name="alvo" min="1" max="100000" placeholder="Quantos passos? (ex.: 10)" required><button class="btn">Criar meta 🎯</button></form>'+
 (l.length?l.map(function(d){var p=Math.min(100,Math.round((d.atual||0)/d.alvo*100));return '<div class="glass item"><div class="tx"><div class="nm">'+esc(d.nome)+(p>=100?' 🎉':'')+'</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="meta">'+(d.atual||0)+' de '+d.alvo+' · '+p+'%</div></div><div class="ab"><button data-a="inc" data-k="metas" data-id="'+d.id+'">➕</button><button data-a="dec" data-k="metas" data-id="'+d.id+'">➖</button>'+(d.owner===me?'<button data-a="del" data-k="metas" data-id="'+d.id+'">🗑️</button>':'')+'</div></div>'}).join(''):'<div class="vazio">Criem a primeira meta juntos ✨</div>');},

 if(t.id==='bc'){var tx='Entra no nosso cantinho 💕 https://claude.ai/artifact/9XrCK6iqZHnqGDR98dSVU2 Código de convite: '+cs.codigo;try{await navigator.clipboard.writeText(tx);alert('Convite copiado! Envie para ela.');}catch(x){prompt('Copie o convite:',tx);}return;}

 if(t.dataset.g){var arr=t.dataset.g=='roleta'?IDEIAS:PERG,el=$(t.dataset.g=='roleta'?'r1':'r2'),n=t.dataset.g=='roleta'?12:1,i=0;var h=setInterval(function(){el.textContent=arr[Math.floor(Math.random()*arr.length)];if(++i>=n)clearInterval(h)},90);return;}
 var k=t.dataset.k,id=t.dataset.id,d=D[k]&&D[k][id];if(!d)return;
 try{
  if(t.dataset.a=='del'){if(await confirm('Apagar este item?'))await C[k].doc(id).delete();}
  if(t.dataset.a=='done')await C[k].doc(id).update({done:!d.done});
  if(t.dataset.a=='inc')await C[k].doc(id).update({atual:Math.min(d.alvo,(d.atual||0)+1)});
  if(t.dataset.a=='dec')await C[k].doc(id).update({atual:Math.max(0,(d.atual||0)-1)});
